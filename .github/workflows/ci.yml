name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The whole game is one HTML file; download it from the run's summary page and double-click it.
      - uses: actions/upload-artifact@v4
        with:
          name: tapeout-game
          path: dist/index.html
