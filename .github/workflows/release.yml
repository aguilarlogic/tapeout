name: Release

# Publishes a GitHub release of the game: the Windows app, as an installer and a portable exe. The release job tests the
# game and opens the release as a draft; the windows job builds the exe files, attaches them and publishes it, so the
# release never shows without its downloads.
# Run it from the Actions tab ("Release" > "Run workflow"), or push a tag like v0.2.0.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create, e.g. v0.2.0 (defaults to the version in package.json)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pkg.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Tag
        id: pkg
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"
          else tag="v$(node -p 'require("./package.json").version')"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Open the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          cat > notes.md <<'NOTES'
          **To play on Windows:** download `Tapeout-Setup-<version>.exe` below and run it. It installs Tapeout for you only
          (no admin rights needed) and adds it to the Start menu. `Tapeout-<version>-portable.exe` runs without installing.
          The game works offline and needs no account.

          Windows may say it protected your PC, because the app is not signed yet. Click More info, then Run anyway.

          Played in a browser before? Open your old `Tapeout.html`, go to Settings > Move your save > Export save, then use
          Import save in the app.
          NOTES
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Tapeout $TAG" --notes-file notes.md --generate-notes

  windows:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The exe file names carry the version, so match package.json to the release tag first.
      - run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
        env:
          TAG: ${{ needs.release.outputs.tag }}
      - run: npm run build
      - run: npm run desktop:build
      - run: npx playwright test --project=electron
      - name: Attach the exe files and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release upload "$TAG" release/Tapeout-Setup-*.exe release/Tapeout-*-portable.exe --clobber
          gh release edit "$TAG" --draft=false --latest
